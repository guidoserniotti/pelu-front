<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Sin conexión - Thomas del Arco</title>
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }
            body {
                font-family: system-ui, -apple-system, sans-serif;
                background-color: #18181b;
                color: #fafafa;
                display: flex;
                align-items: center;
                justify-content: center;
                min-height: 100vh;
                padding: 1rem;
            }
            .container {
                text-align: center;
                max-width: 400px;
            }
            .icon {
                font-size: 4rem;
                margin-bottom: 1.5rem;
            }
            h1 {
                font-size: 1.5rem;
                font-weight: 600;
                margin-bottom: 0.75rem;
                color: #facc15;
            }
            p {
                color: #a1a1aa;
                line-height: 1.6;
                margin-bottom: 1.5rem;
            }
            button {
                background-color: #facc15;
                color: #18181b;
                border: none;
                padding: 0.75rem 1.5rem;
                border-radius: 0.5rem;
                font-size: 1rem;
                font-weight: 600;
                cursor: pointer;
            }
            button:active {
                opacity: 0.8;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <div class="icon">📡</div>
            <h1>Sin conexión</h1>
            <p>
                No se pudo conectar a internet. Verificá tu conexión e
                intentá de nuevo.
            </p>
            <button onclick="location.reload()">Reintentar</button>
        </div>
    </body>
</html>
